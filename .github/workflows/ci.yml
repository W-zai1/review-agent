name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 项目的主运行环境是 Windows（OCR / .bat / 路径处理），CI 跟主环境保持一致。
    runs-on: windows-latest
    timeout-minutes: 20
    # runner 的 Python 默认 stdout 是 cp1252，打印中文会 UnicodeEncodeError；
    # 强制 UTF-8，覆盖本 job 所有 python 调用及其子进程。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # tests/ 在本仓库被 .gitignore 排除（对抗样本不公开），clone 出来没有
      # 那 600 多项回归测试；公开 checkout 里 tests/ 只有金标准数据（无 test*.py）。
      # 所以按"有没有测试文件"判断，而不是目录是否在场：
      # `unittest discover -s tests` 在无测试时会以退出码 5 失败（Python 3.12+），
      # 目录里只有数据文件时不能让它当真跑。
      - name: Public invariants
        run: python -m unittest discover -s checks -v

      # 本地/私有镜像若带 tests/ 测试实现，就顺带跑全量；没有则跳过，不伪装成"跑过了"。
      - name: Full regression (when tests/ is present)
        shell: pwsh
        run: |
          $testFiles = @(Get-ChildItem tests -Recurse -Filter test*.py -File -ErrorAction SilentlyContinue)
          if ($testFiles.Count -gt 0) {
            python -m unittest discover -s tests -v
          } else {
            Write-Host "tests/ has no test files in this checkout - skipped (see checks/)"
          }

      - name: Golden suite (recall / false positives must not regress)
        run: python tools/golden_eval.py

      - name: Changelog guard (clean tree must pass)
        run: python tools/changelog_guard.py --explain
