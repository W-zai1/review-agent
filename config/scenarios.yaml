# 审查情境（scenario）—— 同一份材料，用途不同，该用哪套判定尺度
#
# 为什么需要：判定标准必须跟着「这份东西要拿来干什么」走。
# 招聘初筛看的是「材料内部是否自相矛盾、是否满足岗位要求」；
# 资质核验才需要问「四六级证书是不是真的」。把核验类规则强加给初筛，
# 结果是每份简历都报一条「CET-4 无佐证」——HR 无法行动（只能索要证书原件），
# 却会淹没真正能改的问题（逻辑矛盾、歧视性表述、隐私泄露）。
#
# 关规则可以，但必须**记账**：报告里写清关了哪几条、为什么。
# 否则「未发现」会被读成「不存在」——这是本项目最忌讳的事。
#
# 字段：
#   id / name / desc            标识与展示
#   disable_rules               关闭的规则 ID（按条关闭，粒度最细，优先用这个）
#   disable_dimensions          关闭整个维度（会连带关闭该维度全部规则，慎用）
#   extra_limitations           写进报告 limitations 的说明，{rules} 会替换成实际关闭的规则
#   keep_note                   一句话说明「关掉之后还剩什么」，前端展示用
#
# 版本号：改动本文件必须升 version（报告会记录它，用于区分「换了情境」与「规则库被改」）

version: v1-2026-10-27

# 不指定情境时用它：全规则参与，等价于此前的行为
default: general

scenarios:
  - id: general
    name: 通用文档审查
    desc: 全部规则参与。适合对单份材料做一次完整精读，不预设用途。
    keep_note: 五维全开
    disable_rules: []
    disable_dimensions: []
    extra_limitations: []

  - id: resume-screening
    name: 简历批量初筛
    desc: >-
      按岗位要求做匹配与逻辑/合规检查，**不核验资质真伪**。
      初筛阶段不具备核验条件（要查四六级真伪得索要证书原件、查学信网），
      把「未提供佐证」报成问题只会淹没真正可行动的事项。
    keep_note: 保留逻辑矛盾、合规与隐私风险、岗位匹配、表述风格
    disable_rules:
      # 具体标识（学校/公司/项目地址/证书）必须可复现——初筛不做外部核验
      - FACT-001
      # 引用必须可定位、禁止无出处断言——「已通过 CET-4」这类正是它开火的场景
      - FACT-002
    disable_dimensions: []
    extra_limitations:
      - >-
        本情境（简历批量初筛）已关闭资质核验类规则 {rules}：报告**不判断**证书、学历、
        项目地址等是否属实，只判断材料内部是否自相矛盾、是否满足岗位要求。
        「未报出资质问题」不等于资质已核实，需要时请单独索要证明材料。
