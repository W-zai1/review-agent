# config/match_matrix.yaml —— 「要求侧 vs 候选侧」对照矩阵的维度定义
#
# 为什么是数据不是代码：
#   哪些维度可比对、每侧用什么说法指代它，属于**领域措辞**，不是判定逻辑。
#   放进配置，换场景（招聘 JD / 招标要求 / 客户检查清单）只改这个文件，
#   不用动 tools/match_matrix.py 的判定流程。
#
# 设计约束（与项目原则一致：误报的代价高于漏报）：
#   1. 只有**两侧都能结构化解析**时才给 met/unmet（学历层级、年限数字）；
#      其余一律降到 mentioned / unclear / absent，措辞不带结论。
#   2. 「候选侧没提到」只能说 absent（未提及），**不能说「不具备」**。
#   3. 抽取必须靠**结构**（层级词、数字、列举分隔符），不靠词表猜语义：
#      中文技能项只在列举结构里认，避免把「熟悉业务流程」当成技能项。
#
# 改动本文件不需要动 config/rules_version.txt：它不参与 rules/ 的 hash 链，
# 但报告会记下此处的 version，便于回溯「这份矩阵是按哪版维度出的」。

version: v1-2026-10-26-a1

# 技能项最多抽多少个（超出按出现顺序截断，避免 JD 写成一篇时刷屏）
max_items: 10

dims:
  # ---------------------------------------------------------------- 学历
  # kind: level —— 两侧都能解析出层级，才能比大小；解析不出就只说「提到」。
  - id: education
    name: 学历
    kind: level
    levels: {博士: 5, 硕士: 4, 研究生: 4, 本科: 3, 学士: 3, 大专: 2, 专科: 2, 中专: 1, 高中: 1}
    req: '(博士|硕士|研究生|本科|学士|大专|专科|中专|高中)'
    cand: '(博士|硕士|研究生|本科|学士|大专|专科|中专|高中)'

  # ---------------------------------------------------------------- 年限
  # kind: years —— 只认「N 年…经验/经历」的显式写法。
  # **不按在职区间推算**：区间累计要拿"今天"当锚点，重跑报告会漂移，
  # 与「报告可复现」冲突。区间只用于把结论降级为 unclear 并说明原因。
  - id: experience
    name: 经验年限
    kind: years
    req:
      - '(?<!\d)(\d{1,2})\s*(?:[-~至]\s*(\d{1,2})\s*)?年(?:及)?(?:以上)?[^\n。；;]{0,8}?(?:工作|从业|行业|项目)?(?:经验|经历)'
      - '(?:经验|经历)\s*[:：]?\s*(?<!\d)(\d{1,2})\s*年'
    cand:
      - '(?<!\d)(\d{1,2})\s*(?:[-~至]\s*(\d{1,2})\s*)?年(?:及)?(?:以上)?[^\n。；;]{0,8}?(?:工作|从业|行业|项目)?(?:经验|经历)'
      - '(?:经验|经历)\s*[:：]?\s*(?<!\d)(\d{1,2})\s*年'
    # 只有在要求侧没给数字、却在候选侧发现这些区间时，才提示"未按区间推算"
    range: '(20\d{2})\s*[年.\-/]\s*(\d{1,2})?\s*月?\s*[-~至]\s*(?:(20\d{2})\s*[年.\-/]|至今|今)'

  # ---------------------------------------------------------------- 技能
  # kind: items —— 逐项看"要求侧列了、候选侧有没有出现"。
  # 抽取规则（结构判断，不做语义理解）：
  #   · 引导词（lead）之后、**同一小句内**的列举段才是候选区；
  #   · 只收拉丁字母工具名（Python / SQL / Excel / Figma / Spring Boot）。
  #     中文项**故意不收**：靠结构分不出名词和动词短语——真实 JD 里
  #     「负责模型调用、检索」的「调用」「检索」和「数据分析」长得一样，
  #     收进来就会报「未出现：调用失數」这种假缺口（OCR 噪声下实测踩到）。
  #     漏一项中文技能名的代价，远小于整张表失去可信度。
  - id: skills
    name: 技能/工具
    kind: items
    lead: '(?:精通|熟练掌握|熟练使用|熟练运用|熟练|熟悉|掌握|会使用|具备|技能|工具|技术栈)'
    # 拉丁字母串：允许内部一个空格，"Spring Boot" 才不会被截成 "Spring"
    ascii: '[A-Za-z][A-Za-z0-9+#.\-]*(?:\s[A-Za-z][A-Za-z0-9+#.\-]*)?'

  # ---------------------------------------------------------------- 薪资
  # kind: mention —— 只做"双方都写了"的对照，不判高低：
  # 要求是区间、候选是期望，谁"满足"谁要谈，代码不下结论。
  - id: salary
    name: 薪资
    kind: mention
    req: '(薪资|薪酬|待遇|月薪|年薪|日薪|税前|税后)'
    cand: '(期望薪资|期望薪酬|薪资|薪酬|待遇|月薪|年薪|面议|税前|税后)'

  # ---------------------------------------------------------------- 到岗
  # 只认「到岗/入职/上岗」这种明确的时点要求；「可实习/实习期」是岗位属性不是时点，
  # 收进来会在实习生简历上稳定报一条「未提及」，属于噪声。
  - id: start
    name: 到岗时间
    kind: mention
    req: '(到岗|入职时间|上岗时间)'
    cand: '(到岗|入职时间|随时到岗|立即到岗|一周内|一个月内)'
