# rules/format.yaml —— Word 版式检查的**维度清单**（不含量值）
#
# 这里只说"要查哪些维度"，具体数值由**格式规格**提供：
#   config/format_specs.yaml  →  tools/format_spec.py  →  docx_format_checks.run_all(spec)
#
# 为什么不把"宋体小四、固定 22 磅"写在这里：
# 那是**某一份委托方的格式要求**，换份期刊/换个学校就全变。写进规则库的结果是
# 规则库攒下多套互相矛盾的标准，审的时候没人知道该选哪个；改标准还得改 Python。
# 现在换标准 = 在 config/format_specs.yaml 加一段，不动代码、不升规则版本。
#
# spec_keys：本规则依赖规格里的哪个键；规格没写这个键 → 该规则不参与
#            （并在报告 limitations 写明"这一项本次未检查"，不是"已合规"）。
#
# 执行器：tools/docx_format_checks.py（确定性，逐段取实际值比对规格要求值）
- rule_id: FORMAT-001
  dimension: format
  desc: 正文中文字体应符合所选格式规格规定的字体（显式使用规格之外的字体即违规）
  method: docx_format
  severity: minor
  source: 版式检查通用维度（数值来自所选格式规格）
  spec_keys: [body_font_east]
  auto_fix: false

- rule_id: FORMAT-002
  dimension: format
  desc: 正文字号应符合所选格式规格规定的字号（单位半磅，24 = 小四 12pt）
  method: docx_format
  severity: minor
  source: 版式检查通用维度（数值来自所选格式规格）
  spec_keys: [body_size_halfpt]
  auto_fix: false

- rule_id: FORMAT-003
  dimension: format
  desc: 正文首行缩进应符合所选格式规格（字符数 firstLineChars 或缇值区间）
  method: docx_format
  severity: minor
  source: 版式检查通用维度（数值来自所选格式规格）
  spec_keys: [first_line_chars, first_line_twips_min, first_line_twips_max]
  auto_fix: false

- rule_id: FORMAT-004
  dimension: format
  desc: 正文行距应符合所选格式规格（固定值 lineRule=exact + 缇值，或要求非固定值）
  method: docx_format
  severity: minor
  source: 版式检查通用维度（数值来自所选格式规格）
  spec_keys: [line_twips, line_rule]
  auto_fix: false

- rule_id: FORMAT-005
  dimension: format
  desc: 标题层级不得超过所选格式规格规定的最大级数；应有可识别的标题样式
  method: docx_format
  severity: minor
  source: 版式检查通用维度（数值来自所选格式规格）
  spec_keys: [heading_max_level]
  auto_fix: false

- rule_id: FORMAT-006
  dimension: format
  desc: 图表编号与正文引用一致：正文引用的图/表编号必须有对应题注，题注不得重复
  method: docx_format
  severity: major
  source: 版式检查通用维度（与具体字体字号标准无关，任何格式要求都要求一致）
  spec_keys: [figref]
  auto_fix: false
