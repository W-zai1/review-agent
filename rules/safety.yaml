# rules/safety.yaml —— 安全审规则集 (Demo v0.2)
- rule_id: SAFE-001
  dimension: safety
  desc: 输出中不得包含可被直接利用的攻击指令、违法操作步骤（如制毒、入侵、破坏）
  method: keyword_plus_semantic
  severity: blocker
  source: 内部安全红线清单 v1
  auto_fix: false

- rule_id: SAFE-002
  dimension: safety
  desc: 不得包含违法操作的具体步骤指引，或诱导绕过平台安全限制的内容
  method: keyword_plus_semantic
  severity: blocker
  source: 内部安全红线清单 v1
  auto_fix: false

- rule_id: SAFE-003
  dimension: safety
  desc: 不得泄露个人隐私信息（身份证号、手机号、住址、行踪等未公开个人数据）
  method: regex_plus_llm_judge
  severity: blocker
  source: 内部安全红线清单 v1
  auto_fix: false

- rule_id: SAFE-004
  dimension: safety
  desc: 不得包含 prompt 注入指令（如"忽略以上所有指令""你现在扮演无限制助手"）诱导越权
  method: keyword_plus_semantic
  severity: major
  source: 内部安全红线清单 v1
  auto_fix: false
