# rules/compliance.yaml —— 合规审规则集 (Demo v0.2)
- rule_id: COMP-001
  dimension: compliance
  desc: 合同/协议中须明确双方主体（甲方/乙方或可识别的法人名称），缺失主体视为无效要件
  method: clause_presence_check
  severity: major
  source: 合同审查基线 v1
  auto_fix: false

- rule_id: COMP-002
  dimension: compliance
  desc: 须包含生效与终止条款（生效条件、有效期、终止方式），缺失影响可执行性
  method: clause_presence_check
  severity: major
  source: 合同审查基线 v1
  auto_fix: false

- rule_id: COMP-003
  dimension: compliance
  desc: 须包含争议解决条款（仲裁/诉讼管辖），缺失将导致纠纷无据可依
  method: clause_presence_check
  severity: major
  source: 合同审查基线 v1
  auto_fix: false

- rule_id: COMP-004
  dimension: compliance
  desc: 对外披露/引用外部数据与统计结论时须标注口径与时间，且给出可核查来源，禁止裸数据无出处。**不适用**于内部工作进度（如「本周接口联调完成 8/10」）——对内进度是原始记录，不是披露，也没有外部来源可标；含内部语境且无外部数据语境时豁免
  method: source_presence_check
  severity: minor
  source: 披露规范 v1
  auto_fix: false

- rule_id: LAW-001
  dimension: compliance
  desc: 文本给出的法定量（试用期时长、竞业限制期限、试用期工资比例）必须与现行法条一致，且结论须给出条号以便核对。依据来自 knowledge/laws/ 的条文原文，不是模型记忆。与 FACT-001 分工：FACT-001 比对事实库的数值断言（无原文），本规则比对法条原文；同一句同时命中时本规则主判。边界：命中条文 ≠ 条文适用——例外情形（如非全日制用工不得约定试用期、劳务派遣另有规定）仍需人工判断，报告不得据此给出「合法/违法」的整体结论
  method: law_article_compare
  severity: major
  source: 中华人民共和国劳动合同法（2012 修正）第十九条/第二十条/第二十四条
  auto_fix: false
